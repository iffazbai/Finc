<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finc">
<title>Finc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1F2A;
    --paper: #F7F5F0;
    --teal: #3E7C74;
    --rust: #B5533C;
    --graphite: #6B7280;
    --line: rgba(247,245,240,0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 140px;
  }

  .month-nav {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .month-nav button {
    background: none;
    border: none;
    color: var(--graphite);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .month-nav button:hover { color: var(--paper); }

  .month-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--graphite);
  }

  .backup-row {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }
  .backup-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--graphite);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    display: inline-block;
  }
  .backup-btn:hover { color: var(--paper); border-color: var(--graphite); }

  .balance-block { margin-bottom: 6px; }

  .balance-figure {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .balance-figure.negative { color: var(--rust); }

  .balance-sub {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--graphite);
  }
  .balance-sub .in span { color: var(--teal); }
  .balance-sub .out span { color: var(--rust); }
  .balance-sub span { font-variant-numeric: tabular-nums; }

  .divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 36px 0 8px;
  }

  .entries { list-style: none; margin: 0; padding: 0; }

  .day-heading {
    font-size: 12px;
    color: var(--graphite);
    padding: 20px 0 8px;
  }

  .entry {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .entry-desc { font-size: 15px; }
  .entry-cat {
    font-size: 12px;
    color: var(--graphite);
    display: block;
    margin-top: 2px;
  }

  .entry-amt {
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    text-align: right;
    white-space: nowrap;
  }
  .entry-amt.income { color: var(--teal); }
  .entry-amt.expense { color: var(--rust); }

  .entry-del {
    background: none;
    border: none;
    color: var(--graphite);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .entry:hover .entry-del { opacity: 1; }
  .entry-del:hover { color: var(--rust); }

  .empty-state {
    padding: 60px 0;
    color: var(--graphite);
    font-size: 15px;
    text-align: left;
  }

  /* Add bar */
  .add-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #14171F;
    border-top: 1px solid var(--line);
    padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }

  .add-form {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: 130px 150px auto auto;
    gap: 8px;
  }

  .add-form input, .add-form select {
    background: rgba(247,245,240,0.06);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    outline: none;
    min-width: 0;
  }
  .add-form input::placeholder { color: var(--graphite); }
  .add-form input:focus, .add-form select:focus { border-color: var(--graphite); }

  .add-submit {
    border: none;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
    color: var(--ink);
  }
  .add-submit.in-btn { background: var(--teal); }
  .add-submit.out-btn { background: var(--rust); }
  .add-submit:hover { opacity: 0.88; }

  input[type="date"] { color-scheme: dark; }

  @media (max-width: 560px) {
    .balance-figure { font-size: 44px; }
    .add-form {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "amt date"
        "in out";
    }
    .add-form input[name="amt"] { grid-area: amt; }
    .add-form input[name="entryDate"] { grid-area: date; }
    .add-submit.in-btn { grid-area: in; }
    .add-submit.out-btn { grid-area: out; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="month-nav">
    <button id="prevMonth">&larr; prev</button>
    <span class="month-label" id="monthLabel">August 2026</span>
    <button id="nextMonth">next &rarr;</button>
  </div>

  <div class="backup-row">
    <button id="exportBtn" class="backup-btn">export backup</button>
    <label class="backup-btn" for="importInput">import backup</label>
    <input type="file" id="importInput" accept="application/json" style="display:none;">
  </div>

  <div class="balance-block">
    <div class="balance-figure" id="balanceFigure">৳0</div>
  </div>
  <div class="balance-sub">
    <span class="in">in &nbsp;<span id="totalIn">৳0</span></span>
    <span class="out">out &nbsp;<span id="totalOut">৳0</span></span>
  </div>

  <hr class="divider">

  <ul class="entries" id="entriesList"></ul>
</div>

<div class="add-bar">
  <form class="add-form" id="addForm" autocomplete="off">
    <input type="number" name="amt" placeholder="Amount" step="0.01" min="0" required>
    <input type="date" name="entryDate" required>
    <button type="submit" class="add-submit in-btn">in</button>
    <button type="submit" class="add-submit out-btn">out</button>
  </form>
</div>

<script>
(function () {
  const STORAGE_KEY = 'ledger_entries_v1';
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let viewDate = new Date();
  viewDate.setDate(1);

  const monthLabel = document.getElementById('monthLabel');
  const balanceFigure = document.getElementById('balanceFigure');
  const totalInEl = document.getElementById('totalIn');
  const totalOutEl = document.getElementById('totalOut');
  const entriesList = document.getElementById('entriesList');
  const addForm = document.getElementById('addForm');

  // default the date field to today
  addForm.entryDate.value = new Date().toISOString().slice(0, 10);

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function fmt(n) {
    const abs = Math.abs(n);
    const str = abs.toLocaleString('en-BD', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return '৳' + str;
  }

  function monthKey(d) {
    return d.getFullYear() + '-' + d.getMonth();
  }

  function render() {
    monthLabel.textContent = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    const inMonth = entries.filter(e => {
      const d = new Date(e.date);
      return monthKey(d) === monthKey(viewDate);
    }).sort((a, b) => new Date(b.date) - new Date(a.date));

    const totalIn = inMonth.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const totalOut = inMonth.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    const net = totalIn - totalOut;

    balanceFigure.textContent = (net < 0 ? '-' : '') + fmt(net);
    balanceFigure.classList.toggle('negative', net < 0);
    totalInEl.textContent = fmt(totalIn);
    totalOutEl.textContent = fmt(totalOut);

    entriesList.innerHTML = '';

    if (inMonth.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-state';
      li.textContent = 'Nothing recorded this month yet. Add your first entry below.';
      entriesList.appendChild(li);
      return;
    }

    let lastDay = null;
    inMonth.forEach(e => {
      const d = new Date(e.date);
      const dayStr = d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
      if (dayStr !== lastDay) {
        const h = document.createElement('li');
        h.className = 'day-heading';
        h.textContent = dayStr;
        entriesList.appendChild(h);
        lastDay = dayStr;
      }

      const li = document.createElement('li');
      li.className = 'entry';
      li.innerHTML = `
        <div class="entry-desc">${e.type === 'income' ? 'Income' : 'Expense'}</div>
        <div class="entry-amt ${e.type}">${e.type === 'expense' ? '-' : '+'}${fmt(e.amount)}</div>
        <button class="entry-del" data-id="${e.id}" aria-label="Delete entry">&times;</button>
      `;
      entriesList.appendChild(li);
    });
  }

  let submitType = 'income';
  document.querySelector('.in-btn').addEventListener('click', () => { submitType = 'income'; });
  document.querySelector('.out-btn').addEventListener('click', () => { submitType = 'expense'; });

  addForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const amt = parseFloat(addForm.amt.value);
    const dateVal = addForm.entryDate.value;
    if (isNaN(amt) || amt <= 0 || !dateVal) return;

    entries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      amount: amt, type: submitType,
      date: new Date(dateVal + 'T12:00:00').toISOString()
    });
    save();
    const today = new Date().toISOString().slice(0, 10);
    addForm.reset();
    addForm.entryDate.value = today;
    addForm.amt.focus();
    render();
  });

  entriesList.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.entry-del');
    if (!btn) return;
    entries = entries.filter(e => e.id !== btn.dataset.id);
    save();
    render();
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `ledger-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importInput').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error('not an array');
        const replace = confirm(
          `Found ${imported.length} entries in this backup.\n\nOK = replace everything currently stored.\nCancel = merge with what's already here.`
        );
        if (replace) {
          entries = imported;
        } else {
          const existingIds = new Set(entries.map(e => e.id));
          imported.forEach(e => { if (!existingIds.has(e.id)) entries.push(e); });
        }
        save();
        render();
        alert('Backup imported.');
      } catch (err) {
        alert('Could not read that file — make sure it\'s a ledger backup JSON.');
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  render();
})();
</script>

</body>
</html>
