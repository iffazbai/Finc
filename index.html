<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finc">
<title>Finc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1F2A;
    --paper: #F7F5F0;
    --teal: #3E7C74;
    --rust: #B5533C;
    --graphite: #6B7280;
    --line: rgba(247,245,240,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 160px; }

  .backup-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 32px; }
  .backup-btn {
    background: none; border: 1px solid var(--line); color: var(--graphite);
    font-family: 'Inter', sans-serif; font-size: 12px; padding: 6px 10px;
    border-radius: 4px; cursor: pointer; display: inline-block;
  }
  .backup-btn:hover { color: var(--paper); border-color: var(--graphite); }

  .balance-block { text-align: center; margin-bottom: 8px; }
  .balance-label { font-size: 12px; color: var(--graphite); letter-spacing: 0.05em; margin-bottom: 4px; }
  .balance-figure {
    font-family: 'Fraunces', serif; font-optical-sizing: auto; font-weight: 500;
    font-size: 58px; line-height: 1; letter-spacing: -0.01em;
  }
  .balance-figure.negative { color: var(--rust); }
  .balance-sub { display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 14px; color: var(--graphite); }
  .balance-sub .in span { color: var(--teal); }
  .balance-sub .out span { color: var(--rust); }
  .balance-sub span { font-variant-numeric: tabular-nums; }

  .divider { border: none; border-top: 1px solid var(--line); margin: 32px 0; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .cal-nav button {
    background: none; border: none; color: var(--graphite);
    font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer; padding: 4px 8px;
  }
  .cal-nav button:hover { color: var(--paper); }
  .cal-month-label { font-size: 14px; letter-spacing: 0.02em; color: var(--paper); font-weight: 600; }

  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cal-weekday {
    text-align: center; font-size: 11px; color: var(--graphite); padding-bottom: 6px;
  }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; position: relative; font-size: 13px;
    background: rgba(247,245,240,0.03);
  }
  .cal-day.empty { background: none; cursor: default; }
  .cal-day:hover:not(.empty) { background: rgba(247,245,240,0.08); }
  .cal-day.today { border: 1px solid var(--graphite); }
  .cal-day.selected { background: var(--paper); color: var(--ink); font-weight: 600; }
  .cal-day .dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 3px; }
  .cal-day .dot.pos { background: var(--teal); }
  .cal-day .dot.neg { background: var(--rust); }
  .cal-day.selected .dot.pos { background: var(--teal); }
  .cal-day.selected .dot.neg { background: var(--rust); }

  /* Selected day panel */
  .day-panel { margin-top: 28px; }
  .day-panel-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .day-panel-title { font-size: 15px; font-weight: 600; }
  .day-panel-sub { font-size: 13px; color: var(--graphite); }
  .day-panel-sub .pos { color: var(--teal); }
  .day-panel-sub .neg { color: var(--rust); }

  .entries { list-style: none; margin: 0; padding: 0; }
  .entry {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .entry-desc { font-size: 14px; }
  .entry-amt { font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; white-space: nowrap; }
  .entry-amt.income { color: var(--teal); }
  .entry-amt.expense { color: var(--rust); }
  .entry-del {
    background: none; border: none; color: var(--graphite); font-size: 18px; line-height: 1;
    cursor: pointer; padding: 4px; opacity: 0; transition: opacity 0.15s;
  }
  .entry:hover .entry-del { opacity: 1; }
  .entry-del:hover { color: var(--rust); }

  .empty-state { padding: 24px 0; color: var(--graphite); font-size: 14px; }

  .add-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #14171F;
    border-top: 1px solid var(--line); padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  .add-form { width: 100%; max-width: 560px; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .add-form-date { text-align: center; font-size: 12px; color: var(--graphite); grid-column: 1 / -1; margin-bottom: 4px; }
  .add-form input {
    background: rgba(247,245,240,0.06); border: 1px solid var(--line); color: var(--paper);
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; border-radius: 4px;
    outline: none; min-width: 0;
  }
  .add-form input::placeholder { color: var(--graphite); }
  .add-form input:focus { border-color: var(--graphite); }
  .add-submit {
    border: none; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 14px;
    font-weight: 600; padding: 10px 18px; cursor: pointer; color: var(--ink);
  }
  .add-submit.in-btn { background: var(--teal); }
  .add-submit.out-btn { background: var(--rust); }
  .add-submit:hover { opacity: 0.88; }

  @media (max-width: 480px) {
    .balance-figure { font-size: 44px; }
    .cal-day { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="backup-row">
    <button id="exportBtn" class="backup-btn">export backup</button>
    <label class="backup-btn" for="importInput">import backup</label>
    <input type="file" id="importInput" accept="application/json" style="display:none;">
  </div>

  <div class="balance-block">
    <div class="balance-label">total balance</div>
    <div class="balance-figure" id="balanceFigure">৳0</div>
    <div class="balance-sub">
      <span class="in">all-time in &nbsp;<span id="totalIn">৳0</span></span>
      <span class="out">all-time out &nbsp;<span id="totalOut">৳0</span></span>
    </div>
  </div>

  <hr class="divider">

  <div class="cal-nav">
    <button id="prevMonth">&larr;</button>
    <span class="cal-month-label" id="monthLabel">August 2026</span>
    <button id="nextMonth">&rarr;</button>
  </div>

  <div class="cal-grid" id="calWeekdays"></div>
  <div class="cal-grid" id="calDays" style="margin-top: 4px;"></div>

  <div class="day-panel">
    <div class="day-panel-header">
      <span class="day-panel-title" id="dayPanelTitle">Today</span>
      <span class="day-panel-sub" id="dayPanelSub"></span>
    </div>
    <ul class="entries" id="entriesList"></ul>
  </div>
</div>

<div class="add-bar">
  <form class="add-form" id="addForm" autocomplete="off">
    <div class="add-form-date" id="addFormDate">Adding to Today</div>
    <input type="number" name="amt" placeholder="Amount" step="0.01" min="0" required style="grid-column: 1 / -1;">
    <button type="submit" class="add-submit in-btn">in</button>
    <button type="submit" class="add-submit out-btn">out</button>
  </form>
</div>

<script>
(function () {
  const STORAGE_KEY = 'ledger_entries_v1';
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

  const today = new Date();
  let calViewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  const balanceFigure = document.getElementById('balanceFigure');
  const totalInEl = document.getElementById('totalIn');
  const totalOutEl = document.getElementById('totalOut');
  const monthLabel = document.getElementById('monthLabel');
  const calWeekdays = document.getElementById('calWeekdays');
  const calDays = document.getElementById('calDays');
  const dayPanelTitle = document.getElementById('dayPanelTitle');
  const dayPanelSub = document.getElementById('dayPanelSub');
  const entriesList = document.getElementById('entriesList');
  const addForm = document.getElementById('addForm');
  const addFormDate = document.getElementById('addFormDate');

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }

  function fmt(n) {
    const abs = Math.abs(n);
    const str = abs.toLocaleString('en-BD', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return '৳' + str;
  }

  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function sameDay(a, b) {
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  const WEEKDAYS = ['S','M','T','W','T','F','S'];

  function renderWeekdayHeader() {
    calWeekdays.innerHTML = WEEKDAYS.map(w => `<div class="cal-weekday">${w}</div>`).join('');
  }

  function renderCalendar() {
    monthLabel.textContent = calViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    const year = calViewDate.getFullYear();
    const month = calViewDate.getMonth();
    const firstDayOfWeek = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // net per day for dot markers
    const netByDay = {};
    entries.forEach(e => {
      const d = new Date(e.date);
      if (d.getFullYear() === year && d.getMonth() === month) {
        const key = d.getDate();
        netByDay[key] = (netByDay[key] || 0) + (e.type === 'income' ? e.amount : -e.amount);
      }
    });

    let html = '';
    for (let i = 0; i < firstDayOfWeek; i++) {
      html += '<div class="cal-day empty"></div>';
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const thisDate = new Date(year, month, day);
      const isToday = sameDay(thisDate, today);
      const isSelected = sameDay(thisDate, selectedDate);
      let dotHtml = '';
      if (netByDay[day] !== undefined) {
        const cls = netByDay[day] >= 0 ? 'pos' : 'neg';
        dotHtml = `<span class="dot ${cls}"></span>`;
      }
      html += `<div class="cal-day${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-day="${day}">${day}${dotHtml}</div>`;
    }
    calDays.innerHTML = html;

    calDays.querySelectorAll('.cal-day:not(.empty)').forEach(el => {
      el.addEventListener('click', () => {
        const day = parseInt(el.dataset.day, 10);
        selectedDate = new Date(year, month, day);
        renderCalendar();
        renderDayPanel();
        renderAddFormDate();
      });
    });
  }

  function renderDayPanel() {
    const label = sameDay(selectedDate, today)
      ? 'Today'
      : selectedDate.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: selectedDate.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
    dayPanelTitle.textContent = label;

    const dayEntries = entries.filter(e => sameDay(new Date(e.date), selectedDate))
      .sort((a,b) => new Date(b.date) - new Date(a.date));

    const dayIn = dayEntries.filter(e => e.type === 'income').reduce((s,e)=>s+e.amount,0);
    const dayOut = dayEntries.filter(e => e.type === 'expense').reduce((s,e)=>s+e.amount,0);
    dayPanelSub.innerHTML = (dayIn || dayOut)
      ? `<span class="pos">+${fmt(dayIn)}</span> &nbsp; <span class="neg">-${fmt(dayOut)}</span>`
      : '';

    entriesList.innerHTML = '';
    if (dayEntries.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-state';
      li.textContent = 'Nothing recorded on this day.';
      entriesList.appendChild(li);
      return;
    }
    dayEntries.forEach(e => {
      const li = document.createElement('li');
      li.className = 'entry';
      li.innerHTML = `
        <div class="entry-desc">${e.type === 'income' ? 'Income' : 'Expense'}</div>
        <div class="entry-amt ${e.type}">${e.type === 'expense' ? '-' : '+'}${fmt(e.amount)}</div>
        <button class="entry-del" data-id="${e.id}" aria-label="Delete entry">&times;</button>
      `;
      entriesList.appendChild(li);
    });
  }

  function renderAddFormDate() {
    const label = sameDay(selectedDate, today) ? 'Today' :
      selectedDate.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
    addFormDate.textContent = 'Adding to ' + label;
  }

  function renderBalance() {
    const totalIn = entries.filter(e => e.type === 'income').reduce((s,e)=>s+e.amount,0);
    const totalOut = entries.filter(e => e.type === 'expense').reduce((s,e)=>s+e.amount,0);
    const net = totalIn - totalOut;
    balanceFigure.textContent = (net < 0 ? '-' : '') + fmt(net);
    balanceFigure.classList.toggle('negative', net < 0);
    totalInEl.textContent = fmt(totalIn);
    totalOutEl.textContent = fmt(totalOut);
  }

  function renderAll() {
    renderBalance();
    renderCalendar();
    renderDayPanel();
    renderAddFormDate();
  }

  let submitType = 'income';
  document.querySelector('.in-btn').addEventListener('click', () => { submitType = 'income'; });
  document.querySelector('.out-btn').addEventListener('click', () => { submitType = 'expense'; });

  addForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const amt = parseFloat(addForm.amt.value);
    if (isNaN(amt) || amt <= 0) return;

    const entryDate = new Date(selectedDate);
    entryDate.setHours(12, 0, 0, 0);

    entries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      amount: amt, type: submitType,
      date: entryDate.toISOString()
    });
    save();
    addForm.reset();
    addForm.amt.focus();
    renderAll();
  });

  entriesList.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.entry-del');
    if (!btn) return;
    entries = entries.filter(e => e.id !== btn.dataset.id);
    save();
    renderAll();
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    calViewDate.setMonth(calViewDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    calViewDate.setMonth(calViewDate.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `ledger-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importInput').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error('not an array');
        const replace = confirm(
          `Found ${imported.length} entries in this backup.\n\nOK = replace everything currently stored.\nCancel = merge with what's already here.`
        );
        if (replace) {
          entries = imported;
        } else {
          const existingIds = new Set(entries.map(e => e.id));
          imported.forEach(e => { if (!existingIds.has(e.id)) entries.push(e); });
        }
        save();
        renderAll();
        alert('Backup imported.');
      } catch (err) {
        alert('Could not read that file — make sure it\'s a ledger backup JSON.');
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  renderWeekdayHeader();
  renderAll();
})();
</script>

</body>
</html>
